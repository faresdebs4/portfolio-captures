name: capture
on:
  workflow_dispatch:
  push:
    paths: ['urls.json', 'capture.mjs']
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get update -y && sudo apt-get install -y ttf-mscorefonts-installer fonts-liberation fontconfig
          sudo fc-cache -f
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node capture.mjs
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add shots
          git commit -m "captures" || echo nothing
          git pull --rebase || true
          git push
